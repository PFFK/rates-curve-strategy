# Forward paper trading of the pre-registered H1 curvature fly
# (src/paper_trade.py). Each run appends new trading days to
# data/paper/h1_ledger.csv and commits it, so the git history timestamps
# every decision before its outcome is known.
name: H1 paper trade

on:
  schedule:
    - cron: "30 23 * * 1-5"  # weekdays 23:30 UTC, after FRED posts the day's H.15 yields
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      # Pinned to the versions the backtest was run with, so a library
      # upgrade can't shift the numbers and trip the frozen-rules check.
      - run: pip install -r requirements-lock.txt

      - name: Update ledger
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m src.paper_trade

      - name: Report
        run: python -m src.paper_trade --report >> "$GITHUB_STEP_SUMMARY"

      - name: Commit ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/paper
          if git diff --cached --quiet; then
            echo "No ledger changes."
          else
            git commit -m "Paper trade: H1 ledger through $(tail -1 data/paper/h1_ledger.csv | cut -d, -f1)"
            git push
          fi
